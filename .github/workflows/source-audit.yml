name: Source audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    name: Source-only repository audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject native binaries and game launch files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '\.(exe|dll|dylib|pdb|dsym|bat)$' || true)
          if [[ -n "${forbidden}" ]]; then
            echo "Forbidden tracked files:"
            echo "${forbidden}"
            exit 1
          fi
          json=$(git ls-files '*.json' | grep -v '^tools-manifest\.json$' || true)
          if [[ -n "${json}" ]]; then
            echo "Unexpected tracked JSON files:"
            echo "${json}"
            exit 1
          fi
